<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Three Letters</title>

    <style>
        .i {
            background-color: black;
            display: inline-block;
            margin-right: 20px;
        }

        .il, .ir {
            background-color: white;
            display: inline-block;
            width: 20px;
            height: 50px;
        }

        .il {
            margin: 12px 5px 10px 0;
        }

        .ir {
            margin: 12px 0 10px 5px;
        }

        .t {
            background-color: black;
            display: inline-block;
            margin-right: 20px;
        }

        .tl, .tr {
            background-color: white;
            display: inline-block;
            width: 20px;
            height: 50px;
        }

        .tl {
            margin: 12px 5px 0 0;
        }

        .tr {
            margin: 12px 0 0 5px;
        }

        .l {
            background-color: black;
            display: inline-block;
        }

        .lr {
            background-color: white;
            width: 35px;
            height: 50px;
            margin: 0 0 12px 12px;
        }

    </style>
</head>


<body>

    <div class="i">
        <div class="il"></div>
        <div class="ir"></div>
    </div>

    <div class="t">
        <div class="tl"></div>
        <div class="tr"></div>
    </div>

    <div class="l">
        <div class="lr"></div>
    </div>

</body>

</html>
