<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW4 Task 2</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        #photo_parent {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
        }
        .side {
            display: flex;
            flex-direction: row;
            align-items: center;

            width: 420px;
            height: 420px;
        }
        .photo {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        #photo1 {
            align-self: flex-end;
        }

        #photo2 {
            align-self: center;
        }

        #photo3 {
            align-self: flex-start;
        }
        #photo4 {
            align-self: flex-start;
        }
        #photo5 {
            align-self: center;
        }
        #photo6 {
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div id="photo_parent">
        <div class="side">
            <div class="photo" id="photo1">
                <img src="https://picsum.photos/140/140?random=1"alt="Random image 1">
            </div>
            <div class="photo" id="photo2">
                <img src="https://picsum.photos/140/140?random=2"alt="Random image 2">
            </div>
            <div class="photo" id="photo3">
                <img src="https://picsum.photos/140/140?random=3"alt="Random image 3">
            </div>
        </div>

        <div class="side">
            <div class="photo" id="photo4">
                <img src="https://picsum.photos/140/140?random=4"alt="Random image 4">
            </div>
            <div class="photo" id="photo5">
                <img src="https://picsum.photos/140/140?random=5"alt="Random image 5">
            </div>

            <div class="photo" id="photo6">
                <img src="https://picsum.photos/140/140?random=6"alt="Random image 6">
            </div>
        </div>
    </div>
</body>
</html>
