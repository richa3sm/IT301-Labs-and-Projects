<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 14: API</title>
    <style>
        body {
            text-align: center;
        }

        #profile {
            border: 1px solid black;
            border-radius: 10px;
            padding: 20px;
            width: 300px;
            margin: 20px auto;
        }

        #profile img {
            width: 150px;
            border-radius: 50%;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Random User Generator</h1>
    <p>Click the button to generate a random user profile</p>

    <script>
        const site = 'https://randomuser.me/api/';

        let img = document.createElement('img');
        let name = document.createElement('h2');
        let email = document.createElement('p');
        let phone = document.createElement('p');

        let bttn = document.createElement('button');
        bttn.type = 'button';
        bttn.textContent = 'Generate Profile';

        let profile = document.createElement('div');
        profile.id = 'profile';

        profile.appendChild(img);
        profile.appendChild(name);
        profile.appendChild(email);
        profile.appendChild(phone);

        document.body.appendChild(bttn);
        document.body.appendChild(profile);

        const getProfile = async()=>{
            try{
                let result = await fetch(site);
                result = await result.json();

                let user = result.results[0];

                img.src = user.picture.large;
                img.alt = 'User Picture';

                name.textContent = user.name.first + ' ' + user.name.last;
                email.textContent = 'Email: ' + user.email;
                phone.textContent = 'Phone: ' + user.phone;

            }catch(reason){
                console.log(reason);
            }
        }

        bttn.addEventListener('click', getProfile);

        getProfile();
    </script>
</body>
</html>
