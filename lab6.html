<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Lab</title>

<style>
    #flex_parent {
        width: 100vw;
        height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
    }

    #child1{
        min-height: 50px;
    }
    #child2{
        min-height: 100px;
    }
    #child3{
        min-height: 50px;
    }

</style>
</head>


<body>
    <div id = "flex_parent">
        <div id = "child1">
            <img src="https://picsum.photos/200/200?random=1" alt="Image 1">
        </div>
        <div id = "child2">
            <img src="https://picsum.photos/300/300?random=2" alt="Image 2">
        </div>
        <div id = "child3">
            <img src="https://picsum.photos/200/200?random=3" alt="Image 3">
        </div>
    </div>
</body>
</html>
