<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box Practice</title>

    <style>
        #flex_parent{
            border: solid 1px;
            display: flex;
            align-items: flex-end;
            height: 100px;
        }
        div div {
            background-color: aquamarine;
            border: 1px solid;
            width: 100px;
            height: 100px;
        }
        #child2{
            flex-grow: 1;
        }
        #child1{
            flex-grow: 3;
        }

    </style>
</head>
<body>
    <div id = "flex_parent">
        <div id = "child1">
            1
        </div>

        <div id = "child2">
            2
        </div>

        <div id = "child3">
            3
        </div>
    </div>
</body>
</html>
